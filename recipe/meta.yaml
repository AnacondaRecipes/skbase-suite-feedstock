{% set name = "scikit-base" %}
{% set version = "0.13.1" %}

package:
  name: {{ name|lower }}-suite
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name.replace('-', '_') }}-{{ version }}.tar.gz
  sha256: 169e5427233f7237b38c7d858bf07b8a86bbf59feccf0708e26dad4ac312c593

build:
  number: 0
  skip: true  # [py>314]

requirements:
  host:
    - python
    - pip
    - setuptools
  run:
    - python


outputs:
  - name: {{ name|lower }}
    script: build_base.{{ "bat" if win else "sh" }}
    requirements:
      host:
        - python
        - pip
        - setuptools
        - wheel
      run:
        - python

    test:
      requires:
        - pip
        - pytest
        - numpy
        - scipy
        - pandas
        - scikit-learn >=0.24.0
        - python
      commands:
        - pip check
      imports:
        - skbase
        - skbase.base
        - skbase.lookup
        - skbase.testing
        - skbase.validate

  - name: {{ name|lower }}-all-extras
    build:
    requirements:
      host:
        - python
      run:
        - python
        - {{ pin_subpackage("scikit-base", exact=True) }}
        - pandas
        - numpy

    test:
      imports:
        - skbase
        - skbase.base
        - skbase.lookup
        - skbase.testing
        - skbase.validate
      commands:
        - pip check
      requires:
        - pip
        - pytest
        - numpy
        - scipy
        - pandas
        - scikit-learn >=0.24.0
        - python

about:
  home: https://github.com/sktime/skbase
  summary: Base classes for sklearn-like parametric objects
  description: |
    skbase provides base classes for creating scikit-learn-like parametric objects,
    along with tools to make it easier to build your own packages that follow
    these design patterns.
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE
  doc_url: https://skbase.readthedocs.io/
  dev_url: https://github.com/sktime/skbase

extra:
  recipe-maintainers:
    - mcre-be
    - dhirschfeld
    - yarnabrina
    - fkiraly
